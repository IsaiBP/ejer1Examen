<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paletones de colores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <input type="radio" name="color" id="Blanco" checked>
        
        <input type="radio" name="color" id="negro">
        <input type="radio" name="color" id="verde"> 

        <div class="cuadro">
            <h2 class="texto">
                <span class="mensaje-blanquito">Blanco</span>
                <span class="mensaje-negro">Negrito</span>
                <span class="mensaje-verde">Verdoson</span>
            </h2>

            <div class="botones">
                <label for="Blanco" class="btn-blanco">Blanco</label>
                <label for="negro" class="btn-negro">Negro</label>
                <label for="verde" class="btn-verde">Verde</label>
            </div>
        </div>
    </div>

</body>
</html>
